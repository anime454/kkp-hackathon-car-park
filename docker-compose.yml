services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carpark
      POSTGRES_PASSWORD: carpark
      POSTGRES_DB: carpark
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpark -d carpark"]
      interval: 5s
      timeout: 5s
      retries: 10

  be:
    build:
      context: ./be
      dockerfile: Dockerfile
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: carpark
      POSTGRES_PASSWORD: carpark
      POSTGRES_DB: carpark
      POSTGRES_SSLMODE: disable
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - be
    restart: unless-stopped

volumes:
  postgres_data:
