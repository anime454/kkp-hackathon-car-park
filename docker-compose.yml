services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carpark
      POSTGRES_PASSWORD: carpark
      POSTGRES_DB: carpark
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpark -d carpark"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
